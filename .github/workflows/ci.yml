name: CI

# Shared CI (platform-ci-workflows): lint, typecheck, node --test suite, build, security scan.
# Public repository -> GitHub-hosted runners (CI hosting policy).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      lint-command: npm run lint -- --max-warnings=5
      require-tests: true
      coverage-threshold: "90"
      build-command: NEXT_TELEMETRY_DISABLED=1 npm run build
  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@493a7f5c322219e61245cf17f1fa34de2c35a22b # v1.6.6
